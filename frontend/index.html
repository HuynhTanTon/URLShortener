<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rút gọn Link</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --accent: #0d9488;
    --accent-dark: #0f766e;
    --accent-light: #f0fdfa;
    --ink: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background:
      linear-gradient(180deg, rgba(6, 30, 20, 0.35), rgba(6, 30, 20, 0.55)),
      url("forest-anime-bg.png");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 24px;
    color: var(--ink);
  }

  .card {
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(6px);
    padding: 40px 36px;
    border-radius: 20px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.1), 0 20px 45px rgba(6, 30, 20, 0.35);
    width: 100%;
    max-width: 420px;
  }

  .badge {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--accent-light);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
  }

  .badge svg { width: 22px; height: 22px; stroke: var(--accent); }

  h1 {
    margin: 0 0 6px;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  p.subtitle {
    color: var(--muted);
    margin: 0 0 24px;
    font-size: 14px;
  }

  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    margin-bottom: 10px;
    outline: none;
    transition: border-color 0.15s ease;
    font-family: inherit;
  }

  input[type="text"]:focus { border-color: var(--accent); }

  button {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease;
  }

  button:hover { background: var(--accent-dark); }
  button:disabled { background: #a7b0bc; cursor: not-allowed; }

  #result {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 12px;
    display: none;
    word-break: break-all;
    font-size: 14px;
    line-height: 1.5;
  }

  #result.success { background: var(--accent-light); color: #115e59; }
  #result.error { background: #fef2f2; color: #991b1b; }
  #result a { color: var(--accent-dark); font-weight: 600; text-decoration: none; }
  #result a:hover { text-decoration: underline; }

  .copy-btn {
    margin-top: 10px;
    background: transparent;
    border: 1.5px solid var(--accent);
    color: var(--accent-dark);
    padding: 6px 12px;
    font-size: 12.5px;
    width: auto;
    display: inline-block;
  }

  .copy-btn:hover { background: var(--accent-light); }

  .toggle-link {
    display: inline-block;
    background: none;
    border: none;
    color: var(--accent-dark);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    padding: 0;
    width: auto;
    margin-bottom: 10px;
    font-family: inherit;
  }

  .toggle-link:hover { text-decoration: underline; background: none; }

  #customCodeWrap { display: none; margin-bottom: 4px; }

  #customCodeWrap .hint {
    color: var(--muted);
    font-size: 12px;
    margin: -4px 0 10px;
  }

  .stats-btn {
    margin-top: 8px;
    margin-left: 8px;
    background: transparent;
    border: 1.5px solid var(--muted);
    color: var(--muted);
    padding: 6px 12px;
    font-size: 12.5px;
    width: auto;
    display: inline-block;
  }

  .stats-btn:hover { background: #f1f5f9; }

  #statsBox {
    margin-top: 12px;
    padding: 12px 14px;
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13px;
    color: var(--ink);
    display: none;
    line-height: 1.6;
  }

  #statsBox strong { color: var(--accent-dark); }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07L11.5 4.5" />
        <path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07L12.5 19.5" />
      </svg>
    </div>
    <h1>Rút gọn Link</h1>
    <p class="subtitle">Dán link dài vào ô bên dưới để tạo link ngắn</p>

    <input type="text" id="urlInput" placeholder="https://example.com/link-rat-dai...">

    <button type="button" class="toggle-link" id="toggleCustomBtn" onclick="toggleCustomCode()">+ Đặt mã tuỳ chỉnh (tuỳ chọn)</button>

    <div id="customCodeWrap">
      <input type="text" id="customCodeInput" placeholder="vd: khuyen-mai-2026">
      <p class="hint">3-20 ký tự: chữ, số, gạch ngang/gạch dưới. Để trống nếu muốn hệ thống tự sinh mã.</p>
    </div>

    <button id="submitBtn" onclick="shortenUrl()">Tạo link ngắn</button>

    <div id="result"></div>
    <div id="statsBox"></div>
  </div>

<script src="config.js"></script>
<script>
  const LAMBDA_URL = window.APP_CONFIG.LAMBDA_URL;

  function toggleCustomCode() {
    const wrap = document.getElementById("customCodeWrap");
    const btn = document.getElementById("toggleCustomBtn");
    const show = wrap.style.display !== "block";
    wrap.style.display = show ? "block" : "none";
    btn.textContent = show ? "− Ẩn mã tuỳ chỉnh" : "+ Đặt mã tuỳ chỉnh (tuỳ chọn)";
  }

  async function shortenUrl() {
    const input = document.getElementById("urlInput");
    const customCodeInput = document.getElementById("customCodeInput");
    const resultDiv = document.getElementById("result");
    const statsBox = document.getElementById("statsBox");
    const btn = document.getElementById("submitBtn");
    const url = input.value.trim();
    const customCode = customCodeInput.value.trim();

    resultDiv.style.display = "none";
    statsBox.style.display = "none";

    if (!url) {
      showError("Vui lòng nhập link.");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Đang xử lý...";

    try {
      const payload = { url };
      if (customCode) payload.customCode = customCode;

      const res = await fetch(LAMBDA_URL + "/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      const data = await res.json();

      if (!res.ok) {
        showError(data.error || "Có lỗi xảy ra.");
      } else {
        showSuccess(data.shortUrl, data.shortCode);
      }
    } catch (err) {
      showError("Không thể kết nối tới server. Kiểm tra lại kết nối mạng hoặc CORS.");
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.textContent = "Tạo link ngắn";
    }
  }

  function showSuccess(shortUrl, shortCode) {
    const resultDiv = document.getElementById("result");
    resultDiv.className = "success";
    resultDiv.style.display = "block";
    resultDiv.innerHTML = `
      Link ngắn của bạn: <br>
      <a href="${shortUrl}" target="_blank">${shortUrl}</a><br>
      <button class="copy-btn" onclick="copyToClipboard('${shortUrl}')">Copy link</button>
      <button class="stats-btn" onclick="viewStats('${shortCode}')">Xem số liệu</button>
    `;
  }

  function showError(msg) {
    const resultDiv = document.getElementById("result");
    resultDiv.className = "error";
    resultDiv.style.display = "block";
    resultDiv.textContent = msg;
  }

  function copyToClipboard(text) {
    navigator.clipboard.writeText(text).then(() => alert("Đã copy link!"));
  }

  async function viewStats(shortCode) {
    const statsBox = document.getElementById("statsBox");
    statsBox.style.display = "block";
    statsBox.textContent = "Đang tải số liệu...";

    try {
      const res = await fetch(LAMBDA_URL + "/stats/" + shortCode);
      const data = await res.json();

      if (!res.ok) {
        statsBox.textContent = data.error || "Không lấy được số liệu.";
        return;
      }

      const created = data.createdAt ? new Date(data.createdAt).toLocaleString("vi-VN") : "—";
      const lastClicked = data.lastClickedAt ? new Date(data.lastClickedAt).toLocaleString("vi-VN") : "Chưa có lượt click";

      statsBox.innerHTML = `
        <div>Số lượt click: <strong>${data.clickCount}</strong></div>
        <div>Tạo lúc: ${created}</div>
        <div>Click gần nhất: ${lastClicked}</div>
      `;
    } catch (err) {
      statsBox.textContent = "Không thể kết nối tới server để lấy số liệu.";
      console.error(err);
    }
  }
</script>
</body>
</html>
